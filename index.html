<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Energy Multiplier System | Próximamente</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #1a202c; /* Azul marino oscuro inspirado en tu marca */
        color: #ffffff;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        overflow: hidden;
      }

      .container {
        padding: 2rem;
        animation: fadeIn 1.5s ease-out;
      }

      .logo {
        max-width: 300px;
        width: 100%;
        height: auto;
        margin-bottom: 2rem;
      }

      h1 {
        font-size: 2.5rem;
        font-weight: 300;
        letter-spacing: 2px;
        margin-bottom: 1rem;
        color: #39ff14; /* Verde limón fosforescente */
        text-transform: uppercase;
      }

      p {
        font-size: 1.2rem;
        color: #a0aec0;
        font-weight: 300;
        letter-spacing: 1px;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Responsive para móviles */
      @media (max-width: 600px) {
        .logo {
          max-width: 250px;
        }
        h1 {
          font-size: 1.8rem;
        }
        p {
          font-size: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Asegúrate de que la ruta coincida con el nombre exacto de tu imagen -->
      <img src="img/energy.png" alt="Energy Logo" class="logo" />

      <h1>Próximamente</h1>
      <p>
        Sitio en construcción. Estamos preparando algo grande para tu ahorro de
        energía.
      </p>
    </div>
  </body>
</html>
